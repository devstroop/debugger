name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-0.15.2-${{ runner.os }}
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache: true
      - name: zig build
        run: zig build
      - name: zig build test
        run: zig build test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Zig compiler
        uses: actions/cache@v4
        with:
          path: ~/.cache/setup-zig
          key: zig-0.15.2-${{ runner.os }}
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache: true
      - name: zig build
        run: zig build
      - name: zig build test
        run: zig build test
